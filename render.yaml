services:
  - type: web
    name: flux-backend
    env: python
    plan: free

    buildCommand: |
      pip install --no-cache-dir -r requirements.txt
      cd Fluxy
      python manage.py collectstatic --noinput

    startCommand: cd Fluxy && gunicorn Fluxy.wsgi:application --bind 0.0.0.0:$PORT

    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: Fluxy.settings
      - key: ALLOWED_HOSTS
        value: .onrender.com
