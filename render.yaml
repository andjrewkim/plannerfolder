services:
  - type: web
    name: flux-backend
    env: python
    plan: free
    buildCommand: |
      cd Fluxy
      echo "Python Path:"
      python -c "import sys; print(sys.path)"
      pip install --no-cache-dir -r ../requirements.txt
    startCommand: gunicorn Fluxy.wsgi:application --bind 0.0.0.0:$PORT
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: Fluxy.settings
      - key: ALLOWED_HOSTS
        value: .onrender.com
