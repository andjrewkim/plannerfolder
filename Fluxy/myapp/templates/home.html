{% extends 'base.html' %}
{% load static %}

{% block content %}
    <!-- Page Header -->
    <h1>Event Calendar</h1>

    <!-- Container with Sidebar and Main Content -->
    <div class="container">
        <!-- Sidebar with Widgets -->
        <div class="sidebar" id="sidebar">
            <div class="resize-handle"></div>
            <div class="widget">
                <h3>Today's Schedule</h3>
                <ul id="today-events">
                    <!-- Events for the current date will be dynamically added here -->
                </ul>
            </div>
            
            
            <div class="widget"></div>
            <div class="widget"></div>
        </div>

        <!-- Main Content Area -->
        <div class="main-content">
            <form method="post" class="calendar-form">
                {% csrf_token %}
                {{ form.as_p }}
                <button type="submit" class="submit-button">Submit</button>
            </form>

            {% if result %}
                <div class="extracted-info">
                    <h2>Extracted Information:</h2>
                    <p><strong>Event:</strong> <span>{{ result.event }}</span></p>
                    <p><strong>Time:</strong> <span>{{ result.time }}</span></p>
                    <p><strong>Date:</strong> <span>{{ result.date }}</span></p>
                </div>
            {% endif %}

            <!-- FullCalendar -->
            <div id="calendar"></div>
        </div>
    </div>

    <!-- Modal for Editing Events -->
    <div id="editEventModal" class="modal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <h2>Edit Event</h2>
            <form id="editEventForm">
                <label for="eventTitle">Event Title:</label>
                <input type="text" id="eventTitle" name="eventTitle" required>
                <label for="eventTime">Time:</label>
                <input type="time" id="eventTime" name="eventTime" required>
                <label for="eventDate">Date:</label>
                <input type="date" id="eventDate" name="eventDate" required>
                <button type="submit" class="save-button">Save</button>
            </form>
            <button id="deleteEventButton" class="delete-button">Delete Event</button>
        </div>
    </div>

    <!-- Import Map -->
    <script type='importmap'>
      {
        "imports": {
          "@fullcalendar/core": "https://cdn.skypack.dev/@fullcalendar/core@6.1.15",
          "@fullcalendar/daygrid": "https://cdn.skypack.dev/@fullcalendar/daygrid@6.1.15"
        }
      }
    </script>


    <style>
        #calendar {
          width: 70%; /* Adjust the width as a percentage of the parent container */
          max-width: 10000px; /* Optional: Set a maximum width for larger screens */
          margin: 40px auto; /* Center the calendar horizontally */
          min-width: 300px; /* Optional: Prevent it from getting too small */
        }
      
    </style>




    <!-- Link Your CSS -->
    <link rel="stylesheet" href="{% static 'css/container.css' %}">

    <!-- Include modal, input, and navbar styles -->
    <link rel="stylesheet" href="{% static 'css/modalstyle.css' %}">
    <link rel="stylesheet" href="{% static 'css/inputtext.css' %}">
    <link rel="stylesheet" href="{% static 'css/navbar.css' %}">

    <!-- JS for Calendar -->
    <script type="module" src="{% static 'js/calendar.js' %}"></script>

    <!-- JS for Resizable Sidebar -->
    <script src="{% static 'js/resizing.js' %}"></script>

    <script src="{% static 'js/todolist.js' %}"></script>

{% endblock %}
