<!DOCTYPE html>
{% load static %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>

    <!-- Import Map -->
    <script type='importmap'>
      {
        "imports": {
          "@fullcalendar/core": "https://cdn.skypack.dev/@fullcalendar/core@6.1.15",
          "@fullcalendar/daygrid": "https://cdn.skypack.dev/@fullcalendar/daygrid@6.1.15"
        }
      }
    </script>
    <style>
      /* Basic styling for the calendar */
      #calendar {
        max-width: 900px;
        margin: 40px auto;
      }
    </style>
</head>
<body>
  <h1>-</h1>

  <form method="post">
      {% csrf_token %}
      {{ form.as_p }}
      <button type="submit">Submit</button>
  </form>

  {% if result %}
      <h2>Extracted Information:</h2>
      <p><strong>Event:</strong> {{ result.event }}</p>
      <p><strong>Time:</strong> {{ result.time }}</p>
      <p><strong>Date:</strong> {{ result.date }}</p>
  {% endif %}

  <!-- FullCalendar -->
  <div id="calendar"></div>

    <!-- Modal -->
  <!-- Modal for Editing Events -->
  <div id="editEventModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Edit Event</h2>
      <form id="editEventForm">
        <label for="eventTitle">Event Title:</label>
        <input type="text" id="eventTitle" name="eventTitle" required>
        <label for="eventTime">Time:</label>
        <input type="time" id="eventTime" name="eventTime" required>
        <label for="eventDate">Date:</label>
        <input type="date" id="eventDate" name="eventDate" required>
        <button type="submit">Save</button>
      </form>
      <button id="deleteEventButton" style="background-color: red; color: white; margin-top: 10px;">Delete Event</button>
    </div>
  </div>


  <script type="module" src="{% static 'js/calendar.js' %}"></script>
</html>
